<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCC responsive role review</title><style>body{margin:0;padding:18px;background:#e8eef5;color:#003d70;font:14px/1.5 'Segoe UI',sans-serif}header{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px}label{display:flex;gap:8px;align-items:center}select{padding:9px;border:1px solid #cbd5e1;border-radius:8px;background:white;font:inherit}main{overflow:auto;padding:8px}iframe{display:block;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 8px 30px #003d7015;background:white;margin:0 auto}p{margin:0;font-size:12px;color:#52647a}</style></head><body><header><strong>LOCAL RESPONSIVE REVIEW</strong><label>Role<select id="role"><option>System Admin</option><option>Pastor</option><option>Registration Team</option><option>Finance Team</option><option>Ministry Leader</option><option>Cell Leader</option><option>Group Leader</option><option>Combined Leader</option><option>Member</option></select></label><label>Page<select id="page"><option value="/dashboard">Workspace overview</option><option value="/members">Members</option><option value="/members/new">Member form</option><option value="/cell-groups">Cell Groups</option><option value="/ministry">Ministry</option><option value="/users">Users</option><option value="/users/new">User form</option><option value="/services">Services</option><option value="/events">Events</option><option value="/finance">Finance</option><option value="/finance/expenses">Expenses</option><option value="/attendance/qr">QR Attendance</option><option value="/inventory">Inventory</option><option value="/archives">Archives</option><option value="/audit-logs">Audit Logs</option><option value="/settings">Settings</option><option value="/my-settings">My settings</option></select></label><label>Viewport<select id="size"><option value="390,844">Phone · 390 × 844</option><option value="320,720">Small phone
