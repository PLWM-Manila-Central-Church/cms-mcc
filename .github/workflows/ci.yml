name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cms-api/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Run API tests
        run: npm test

  database-migrations:
    name: Fresh database migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: plwm_mcc
          MYSQL_USER: mcc_test
          MYSQL_PASSWORD: mcc_test_only
          MYSQL_ROOT_PASSWORD: mcc_root_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
          --health-start-period=20s
    defaults:
      run:
        working-directory: cms-api
    env:
      NODE_ENV: test
      JWT_SECRET: qr-attendance-ci-integration-secret-only
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: plwm_mcc
      DB_USER: mcc_test
      DB_PASSWORD: mcc_test_only
      DB_SSL: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cms-api/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Apply all migrations to a fresh database
        run: npm run db:migrate
      - name: Run QR attendance persistence integration tests
        env:
          QR_ATTENDANCE_INTEGRATION_DB: "true"
        run: npm run test:qr-integration

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms-frontend
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cms-frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
